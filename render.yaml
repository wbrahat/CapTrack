services:
  # ১. ব্যাকএন্ড ওয়েব সার্ভিস (Web Service)
  - type: web
    name: captrack-backend
    runtime: node
    region: oregon
    plan: free            # ব্যাকএন্ডের জন্য ফ্রি প্ল্যান এখানে কাজ করবে
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false       # এটি রেন্ডার ড্যাশবোর্ডে খালি ঘর হিসেবে শো করবে

  # ২. ফ্রন্টএন্ড স্ট্যাটিক সাইট (Static Site)
  - type: static          # এটি অবশ্যই static হতে হবে (আগে web ছিল)
    name: captrack-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist      # রেন্ডারের নতুন স্ট্যান্ডার্ড অনুযায়ী এটি publishDir হবে
    envVars:
      - key: VITE_API_URL
        value: https://captrack-backend.onrender.com # আপনার ব্যাকএন্ডের রেন্ডার URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html