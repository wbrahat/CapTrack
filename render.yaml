services:
  # ১. ব্যাকএন্ড ওয়েব সার্ভিস
  - type: web
    name: captrack-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false

  # ২. ফ্রন্টএন্ড স্ট্যাটিক সাইট
  - type: web
    name: captrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://captrack-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html