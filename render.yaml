services:
  # ১. ব্যাকএন্ড ওয়েব সার্ভিস (Web Service)
  - type: web
    name: captrack-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false       # এটি ড্যাশবোর্ড থেকে পেস্ট করার জন্য খালি ঘর শো করবে

  # ২. ফ্রন্টএন্ড স্ট্যাটিক সাইট (Static Site)
  - type: static_site     # আগে এখানে ভুলবশত 'static' লেখা হয়েছিল, এটি 'static_site' হবে
    name: captrack-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist      # বিল্ড করা ফাইল ফোল্ডারের নাম
    envVars:
      - key: VITE_API_URL
        value: https://onrender.com # ব্যাকএন্ডের সাথে কানেক্ট করার লিংক
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
